name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Set status bar and navigation bar colors (black)
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/res/values/styles.xml"
          s = open(p, encoding="utf-8").read()
          items = (
              '        <item name="android:statusBarColor">#000000</item>\n'
              '        <item name="android:navigationBarColor">#000000</item>\n'
              '        <item name="android:windowBackground">@android:color/black</item>\n'
              '        <item name="android:windowLightStatusBar">false</item>\n'
              '        <item name="android:windowLightNavigationBar">false</item>\n'
          )
          pat = r'(<style name="AppTheme\.NoActionBar"[^>]*>)(.*?)(</style>)'
          s, n = re.subn(pat, lambda m: m.group(1) + m.group(2) + items + "    " + m.group(3), s, count=1, flags=re.S)
          assert n == 1, "AppTheme.NoActionBar not found"
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - name: Apply app icon and splash screen
        run: |
          pip install pillow
          python3 scripts/apply_assets.py

      - name: Copy web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bazar-hisab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
