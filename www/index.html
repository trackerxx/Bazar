<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>দাম হিসাব</title>
<style>
/* Layout: a one-screen phone app. Header on top, the active view fills the middle, tab bar at the bottom. Nothing scrolls in normal use; histories are paged to fit the height. */
:root {
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --field: #F6F8FB;
  --field-2: #E1E6EF;
  --ink: #16213A;
  --muted: #566178;
  --line: #D5DAE5;
  --line-strong: #A9B3C9;
  --accent: #2A4BA0;
  --accent-soft: #DCE4F8;
  --accent-ink: #FFFFFF;
  --good: #14724A;
  --bad: #B3261E;
  --bad-bg: #FADBD8;
  --shadow: rgba(22, 33, 58, .14);
  --glass: rgba(255, 255, 255, .55);
  --glass-line: rgba(22, 33, 58, .14);
  --glass-sel: rgba(42, 75, 160, .16);
  --display: "Noto Sans Bengali", "Hind Siliguri", "Nirmala UI", system-ui, sans-serif;
  --body: "Noto Sans Bengali", "Hind Siliguri", "Nirmala UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151F;
    --surface: rgba(255, 255, 255, .07);
    --field: rgba(255, 255, 255, .06);
    --field-2: rgba(255, 255, 255, .045);
    --ink: #F3F6FB;
    --muted: #8E99AE;
    --line: rgba(255, 255, 255, .12);
    --line-strong: rgba(255, 255, 255, .24);
    --accent: #DDE3F0;
    --accent-soft: rgba(255, 255, 255, .12);
    --accent-ink: #0A0D13;
    --good: #6FD3A1;
    --bad: #FF9C93;
    --bad-bg: rgba(255, 70, 60, .16);
    --shadow: rgba(0, 0, 0, .65);
    --glass: rgba(34, 38, 48, .5);
    --glass-line: rgba(255, 255, 255, .16);
    --glass-sel: rgba(255, 255, 255, .14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151F;
  --surface: rgba(255, 255, 255, .07);
  --field: rgba(255, 255, 255, .06);
  --field-2: rgba(255, 255, 255, .045);
  --ink: #F3F6FB;
  --muted: #8E99AE;
  --line: rgba(255, 255, 255, .12);
  --line-strong: rgba(255, 255, 255, .24);
  --accent: #DDE3F0;
  --accent-soft: rgba(255, 255, 255, .12);
  --accent-ink: #0A0D13;
  --good: #6FD3A1;
  --bad: #FF9C93;
  --bad-bg: rgba(255, 70, 60, .16);
  --shadow: rgba(0, 0, 0, .65);
  --glass: rgba(34, 38, 48, .5);
  --glass-line: rgba(255, 255, 255, .16);
  --glass-sel: rgba(255, 255, 255, .14);
  color-scheme: dark;
}

:root {
  --bg-grad:
    linear-gradient(180deg, #000000 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 85%, #000000 100%),
    radial-gradient(90% 34% at 15% 36%, rgba(175, 185, 210, .32), rgba(160, 170, 195, 0) 72%),
    radial-gradient(80% 32% at 90% 64%, rgba(150, 160, 195, .26), rgba(130, 140, 170, 0) 74%),
    radial-gradient(60% 22% at 55% 50%, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 70%);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { background: #000000; overscroll-behavior: none; }
button { -webkit-touch-callout: none; transition: none; }
/* no coloured flash or text selection when a button is tapped */
body { -webkit-user-select: none; user-select: none; }
input { -webkit-user-select: text; user-select: text; }
button { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button:focus:not(:focus-visible) { outline: none; }
body {
  background: var(--bg-grad);
  background-color: #000000;
  background-repeat: no-repeat;
  background-size: 100% 100%;
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 12px;
  overflow: hidden;
}
.app { max-width: 460px; height: 100%; margin-inline: auto; display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
h1 { font-family: var(--display); font-size: 1.3rem; font-weight: 700; line-height: 1.2; margin: 0; }
.now { font-size: .85rem; font-weight: 700; color: #FFFFFF; white-space: nowrap; margin-left: auto; font-variant-numeric: tabular-nums; }
.sync { font-size: .74rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync[hidden] { display: none; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-k="cloud"]::before { background: var(--good); }

/* each view fills the middle; it only scrolls if the screen is squeezed (for example by the keyboard) */
.view {
  position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px;
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
}
.view::-webkit-scrollbar { display: none; }
.view[hidden] { display: none; }

.field { display: grid; gap: 3px; min-width: 0; align-content: start; flex: none; }
.field[hidden] { display: none; }
label { font-size: .72rem; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
input, select {
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 44px; width: 100%; min-width: 0;
}
.mwrap { position: relative; }
.msuf { position: absolute; left: 11px; top: 0; bottom: 0; display: flex; align-items: center; pointer-events: none; font: inherit; font-size: 1rem; color: var(--ink); white-space: pre; max-width: calc(100% - 22px); overflow: hidden; }
.msuf[hidden] { display: none; }
.msuf i { visibility: hidden; font-style: normal; }
input::placeholder { color: var(--muted); opacity: .75; }
input::selection { background: var(--glass-sel); color: var(--ink); -webkit-text-fill-color: var(--ink); }
input::-moz-selection { background: var(--glass-sel); color: var(--ink); }
/* the focus ring sits inside the box so the edge of the screen never cuts it off */
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
input:focus { border-color: var(--accent); }
.pick {
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--field); text-align: left;
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 44px; width: 100%; min-width: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 6px; cursor: pointer;
}
.pick[aria-expanded="true"] { border-color: var(--accent); }
.chev { width: 16px; height: 16px; flex: none; color: var(--muted); fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.menu {
  position: fixed; z-index: 50; padding: 6px; display: grid; gap: 2px; border-radius: 16px;
  background: rgba(30, 34, 44, .97); border: 1px solid var(--glass-line);
}
.menu[hidden] { display: none; }
.menu button {
  font: inherit; font-weight: 600; text-align: left; min-height: 44px; padding: 8px 12px; border: 0; border-radius: 11px;
  background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer;
}
.menu button[aria-selected="true"] { background: var(--glass-sel); }
.chk { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex: none; }
.row2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; flex: none; }
.row2[hidden] { display: none; }

.seg { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; background: var(--field-2); border-radius: 12px; }
.seg button { font: inherit; font-weight: 600; font-size: .88rem; min-height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }

.memo {
  flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 16px; display: grid; align-content: start; gap: 2px; position: relative;
}
.reset-btn { position: absolute; right: 8px; bottom: 6px; width: 38px; height: 38px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.reset-btn:active { background: var(--accent-soft); color: var(--accent); }
.reset-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.memo .sub-row { padding-right: 40px; }
.memo-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.memo-label { font-weight: 600; color: var(--muted); font-size: .85rem; flex: none; }
.memo-detail { color: var(--muted); font-size: .82rem; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.memo-total { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 6vh, 2.7rem); line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.memo-total .cur { font-family: var(--body); font-size: 1em; font-weight: 600; margin-left: .04em; line-height: 1; }
.h-total .cur, .histbox .h-total .cur { font-family: var(--body); font-size: .95em; font-weight: 700; color: var(--ink); margin-left: .12em; }
.memo-total small { font-family: var(--body); font-size: .75em; font-weight: 700; line-height: 1; color: var(--ink); margin-left: .3em; vertical-align: baseline; }
.sub-row { min-height: 22px; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.primary { flex: none; font: inherit; font-weight: 600; font-size: 1rem; min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer; width: 100%; }
.primary:disabled { opacity: .45; cursor: not-allowed; }

/* calculator */
.screen { position: relative; flex: 1 1 0; min-height: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; text-align: right; display: flex; flex-direction: column; justify-content: flex-end; gap: 0; overflow: hidden; }
.c-expr { --cl: 26px; flex: 0 1 auto; min-height: var(--cl); max-height: calc(var(--cl) * 3); padding-left: 52px; color: var(--muted); font-size: .85rem; line-height: var(--cl); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; white-space: normal; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.c-expr::-webkit-scrollbar { display: none; }
.c-out { flex: none; }
.c-n { padding: 3px 2px; border-radius: 6px; cursor: pointer; }
.c-n:active { background: var(--accent-soft); color: var(--ink); }
.c-ed { font: inherit; font-size: 1.1em; font-weight: 700; color: var(--ink); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 6px; padding: 0 4px; min-height: 0; height: 1.6em; text-align: center; vertical-align: middle; caret-color: var(--accent); }
.c-item[data-vf] { cursor: pointer; }
.c-item[data-vf]:active { background: var(--accent-soft); }
.c-out { font-family: var(--display); font-weight: 700; font-size: clamp(1.8rem, 5.5vh, 2.4rem); line-height: 1.2; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.icon-btn { position: absolute; left: 8px; top: 8px; width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--field-2); color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { transform: scale(.95); }
.keys { flex: 0 1 460px; min-height: 0; max-height: 460px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, minmax(44px, 1fr)); gap: 8px; }
.keys button {
  font-family: var(--display); font-weight: 600; font-size: clamp(1.15rem, 3.6vh, 1.5rem); min-height: 0; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; padding: 0;
}
.keys button:active { transform: scale(.97); }
.keys .op { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.keys .fn { background: var(--field-2); border-color: transparent; }
.keys .clr { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.keys .eq { background: var(--accent); color: var(--accent-ink); border-color: transparent; grid-row: span 2; }
.keys .z { grid-column: span 2; }

/* calculator history sheet, laid over the keypad */
.sheet { position: absolute; inset: 0; z-index: 2; background: var(--bg-grad) #000000; display: flex; flex-direction: column; gap: 10px; }
.sheet[hidden] { display: none; }
.sheet-head { flex: none; display: flex; align-items: center; gap: 8px; min-height: 42px; }
.sheet-head h2 { flex: 1; min-width: 0; }
.back { font: inherit; font-weight: 600; font-size: .9rem; min-height: 42px; padding: 0 12px; border-radius: 12px; border: 0; background: var(--field-2); color: var(--ink); cursor: pointer; }
.c-item { height: 72px; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
.c-no { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: .74rem; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.c-body { min-width: 0; display: grid; gap: 2px; }
.c-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-width: 0; }
.c-e { color: var(--muted); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; font-variant-numeric: tabular-nums; }
.c-r { font-family: var(--display); font-weight: 700; font-size: 1.2rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.c-sub { font-size: .74rem; color: var(--muted); }

/* verify sheet (মিলান): step through the prices with arrows */
#vsheet { z-index: 3; overflow-y: auto; scrollbar-width: none; }
#vsheet::-webkit-scrollbar { display: none; }
.v-sum { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.v-stage { flex: none; display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: stretch; }
.v-arr { font-family: var(--display); font-size: 2rem; font-weight: 600; line-height: 1; border-radius: 16px; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); cursor: pointer; padding: 0 0 4px; min-height: 72px; }
.v-arr:active { transform: scale(.96); }
.v-cur { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: grid; place-content: center; text-align: center; gap: 0; padding: 8px; min-width: 0; }
.v-pos { font-size: .85rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.v-num { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; }
.v-row { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.v-row[hidden] { display: none; }
.v-row .primary, .v-row .back { width: 100%; min-height: 48px; padding: 0; font-size: 1rem; border-radius: 12px; }
.v-btns { flex: none; display: flex; justify-content: center; gap: 14px; }
.v-btns[hidden] { display: none; }
.v-cur { cursor: pointer; }
.v-cur input { font: inherit; font-size: 1.3rem; font-weight: 700; color: var(--ink); background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 6px; padding: 0 6px; min-height: 0; height: 1.7em; width: auto; text-align: center; caret-color: var(--accent); }
.v-lbl { flex: none; font-size: .72rem; font-weight: 500; color: var(--muted); }
.v-scroll { --vl: 28px; position: relative; max-height: calc(var(--vl) * 5); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; line-height: var(--vl); }
.v-scroll::-webkit-scrollbar { display: none; }
.v-n { padding: 3px 4px; border-radius: 8px; cursor: pointer; }
.v-n.done { color: var(--good); }
.v-n.cur { background: var(--accent); color: var(--accent-ink); }
.v-n.cur.done { background: var(--good); color: #04130C; }
.v-chips { flex: none; display: flex; flex-wrap: wrap; gap: 6px; }
.v-chip { font: inherit; font-weight: 600; font-size: .95rem; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; cursor: pointer; }
.v-chip.done { border-color: var(--good); color: var(--good); background: var(--accent-soft); }
.v-ok { color: var(--good); font-weight: 700; }
.v-chip.cur { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.v-chip.cur.done { border-color: var(--good); background: var(--good); color: #04130C; }
.v-tot { flex: none; font-size: .86rem; color: var(--muted); font-variant-numeric: tabular-nums; display: grid; gap: 2px; }
.v-tot b { color: var(--ink); }

/* price history, paged so it never scrolls */
.hist-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
h2 { font-family: var(--display); font-size: 1.05rem; font-weight: 700; margin: 0; }
.hist-list { flex: 1 1 0; min-height: 0; overflow: hidden; }
.histbox { flex: 1 1 0; min-height: 92px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px 2px; }
.histbox-head { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 34px; }
.histbox-head h2 { text-align: left; justify-self: start; }
.hb-left { justify-self: start; }
.hb-right { justify-self: end; }
.trash-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 32px; padding: 0; border: 0; background: none; color: #FF0000; cursor: pointer; }
.trash-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hb-confirm { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 6px; }
.hb-confirm[hidden] { display: none; }
.histbox-head.asking > :not(.hb-confirm) { display: none; }
.histbox-head h2 { font-size: .78rem; }
.histbox .h-title { font-size: .76rem; }
.histbox .h-total { font-size: .82rem; padding-right: 6px; }
.histbox .h-total span { font-size: .66em; }
.histbox .h-meta { font-size: .54rem; }
.histbox .h-item .link-btn { font-size: .66rem; min-height: 20px; padding: 0 5px; }
.histbox .pg-info { font-size: .64rem; }
.histbox .empty { font-size: .78rem; }
.hb-right .trash-btn { width: 26px; }
.trash-btn.sm { width: 26px; height: 20px; }
.trash-btn.sm svg { width: 13px; height: 13px; }
.h-actions { align-items: center; }
.h-item .h-actions .link-btn { display: inline-flex; align-items: center; line-height: 1; }
.h-item .trash-btn.sm svg { transform: translateY(-1.5px); }
.cfm { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 24px; }
.cfm[hidden] { display: none; }
.cfm-box { width: 100%; max-width: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.cfm-title { font-family: var(--display); font-weight: 700; font-size: 1rem; margin: 0 0 6px; color: var(--ink); text-align: center; }
.cfm-msg { text-align: center; margin: 0 0 14px; font-size: .88rem; color: var(--muted); line-height: 1.5; }
.cfm-btns { display: flex; justify-content: space-between; gap: 8px; }
.cfm-btns button { font: inherit; font-weight: 600; font-size: .9rem; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; }
.cfm-btns .cfm-yes { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.hb-tools { display: flex; align-items: center; gap: 2px; min-width: 0; }
.hb-tools .link-btn { min-height: 28px; }
.hb-pager { display: flex; align-items: center; gap: 2px; }
.hb-pager[hidden] { display: none; }
.hb-pager .pg-info { min-width: 3.4em; font-size: .78rem; }
.pg-mini { font: inherit; font-weight: 700; font-size: 1rem; width: 30px; height: 24px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer; padding: 0; line-height: 1; }
.pg-mini:disabled { opacity: .35; cursor: not-allowed; }
.h-item { height: 40px; padding: 3px 0 1px; border-bottom: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; gap: 0; overflow: hidden; }
.h-item .link-btn { min-height: 24px; font-size: .8rem; padding: 0 6px; }
.h-main { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.h-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-total { font-family: var(--display); font-weight: 700; font-size: 1.1rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.h-total span { font-size: .7em; font-weight: 600; color: var(--muted); margin-left: .25em; }
.h-sub { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.h-meta { font-size: .76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.h-actions { display: flex; gap: 2px; margin-left: auto; flex: none; }
.link-btn { font: inherit; font-weight: 600; font-size: .85rem; background: none; border: 0; color: var(--accent); min-height: 32px; padding: 0 8px; cursor: pointer; }
.link-btn.muted { color: var(--muted); }
.link-btn.danger { color: var(--bad); }
.ask { font-size: .85rem; color: var(--muted); }
.empty { color: var(--muted); margin: 8px 0 0; }
.pager { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.pager .pg { font: inherit; font-weight: 600; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.pager .pg:disabled { opacity: .4; cursor: not-allowed; }
.pg-info { font-size: .85rem; color: var(--muted); min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }

.tabs { flex: none; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 4px; background: var(--field-2); border-radius: 14px; }
.tabs button {
  font: inherit; font-weight: 600; font-size: .92rem; min-height: 44px; padding: 6px;
  border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }
.count { font-size: .72rem; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; }
.count:empty { display: none; }

/* glass panels: see-through with blur, a soft top highlight */
.memo, .histbox, .screen { box-shadow: inset 0 1px 0 rgba(255,255,255,.10); }
input, .pick, .tabs, .seg { box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.tabs button[aria-selected="true"], .seg button[aria-checked="true"] { background: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.cfm-box { background: rgba(28,32,42,.97); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
.primary { background: rgba(235,240,250,.88); }
.keys .eq { background: rgba(235,240,250,.88); }
@media (max-height: 640px) {
  .app { gap: 6px; }
  .view { gap: 6px; }
  input, select, .pick { min-height: 38px; }
  .seg button { min-height: 32px; }
  .memo { padding: 6px 12px; }
  .memo-total { font-size: 1.7rem; }
  .sub-row { min-height: 18px; }
  .primary { min-height: 44px; }
  .tabs button { min-height: 40px; }
  .histbox { min-height: 92px; }
  body { padding-block: 6px; }
  h1 { font-size: 1.15rem; }
  .keys { gap: 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
(function () {
"use strict";

/*PURE*/
var BN = "০১২৩৪৫৬৭৮৯";
var UNITS = { g: { n: "গ্রাম", f: 1 }, kg: { n: "কেজি", f: 1000 }, poa: { n: "পোয়া", f: 250 } };

function toAscii(s) {
  return String(s).replace(/[০-৯]/g, function (d) { return BN.indexOf(d); }).replace(/,/g, "").replace(/।/g, ".").trim();
}
function parse(s) {
  var t = toAscii(s);
  return /^(\d+\.?\d*|\.\d+)$/.test(t) ? parseFloat(t) : NaN;
}
function r2(n) { return Math.round((n + 1e-9) * 100) / 100; }
function r1(n) { return Math.round((n + 1e-9) * 10) / 10; }

function compute(f) {
  var rp = parse(f.rp), rwv = parse(f.rw), wv = parse(f.w), amt = parse(f.amt);
  var ru = UNITS[f.ru] || UNITS.g, wu = UNITS[f.wu] || UNITS.g;
  var rwG = rwv * ru.f, wG = wv * wu.f;
  var rateOk = rp > 0 && rwG > 0, weightOk = wG > 0, amtOk = amt > 0;
  var perG = rateOk ? rp / rwG : NaN;
  return {
    rateOk: rateOk, weightOk: weightOk, amtOk: amtOk, perG: perG,
    total: rateOk && weightOk ? perG * wG : NaN,
    grams: rateOk && amtOk ? amt / perG : NaN,
    rp: rp, rwv: rwv, wv: wv, wG: wG, amt: amt
  };
}

function evalExpr(s) {
  var i = 0;
  function num() {
    var st = i;
    while (i < s.length && /[0-9.]/.test(s[i])) i++;
    if (st === i) throw new Error("num");
    var v = parseFloat(s.slice(st, i));
    if (isNaN(v)) throw new Error("num");
    return v;
  }
  function factor() { if (s[i] === "-") { i++; return -factor(); } return num(); }
  function term() {
    var v = factor();
    while (s[i] === "*" || s[i] === "/") { var o = s[i++]; var r = factor(); v = o === "*" ? v * r : v / r; }
    return v;
  }
  function expr() {
    var v = term();
    while (s[i] === "+" || s[i] === "-") { var o = s[i++]; var r = term(); v = o === "+" ? v + r : v - r; }
    return v;
  }
  var v = expr();
  if (i !== s.length) throw new Error("end");
  return v;
}
/*ENDPURE*/

var $ = function (id) { return document.getElementById(id); };

/* ---------- formatting (Bengali digits) ---------- */
var nfCache = {};
function nf(min, max) {
  var k = min + "-" + max;
  return nfCache[k] || (nfCache[k] = new Intl.NumberFormat("bn-BD-u-nu-beng", { minimumFractionDigits: min, maximumFractionDigits: max }));
}
function money(n) {
  if (!isFinite(n)) return "—";
  var r = r2(n);

  $("c-out").textContent = out;
  if (calc.ed) {
    var inp = $("c-ed");
    if (inp) {
      updateEditOut();
      try { inp.focus({ preventScroll: true }); var L = inp.value.length; inp.setSelectionRange(L, L); inp.scrollIntoView({ block: "nearest" }); } catch (x) {}
    }
  } else ce.scrollTop = ce.scrollHeight;
}

function addCalc(e) {
  state.calc.unshift(e);
  if (state.calc.length > MAX_CALC) state.calc.length = MAX_CALC;
  cPg.p = 0;
  persistAll();
  if (!$("csheet").hidden) renderCalcHist();
}

function press(k) {
  if (calc.ed) {
    if (k === "C") calc.ed = null;
    else if (editKey(k)) return;
    else commitEdit();
  }
  var e = calc.expr;
  calc.err = "";
  if (k === "C") { calc.expr = ""; calc.last = ""; calc.fresh = false; }
  else if (k === "⌫") {
    if (calc.fresh) { calc.expr = ""; calc.fresh = false; calc.last = ""; } else calc.expr = e.slice(0, -1);
  }
  else if (k === "=") {
    if (calc.fresh) return;
    var t = trimTail(e);
    if (t === "" || t === "-" || !hasOp(t)) return;
    var v; try { v = evalExpr(t); } catch (x) { v = NaN; }
    if (!isFinite(v)) { calc.err = "ভাগ করা যায় না"; calc.last = t; calc.expr = ""; renderCalc(); return; }
    v = round8(v);
    var s = String(v);
    addCalc({ id: uid(), t: "c", ts: Date.now(), expr: t, result: v });
    calc.last = t;
    if (/e/i.test(s)) { calc.expr = ""; calc.fresh = false; } else { calc.expr = s; calc.fresh = true; }
  }
  else if (/^\d$/.test(k)) {
    if (calc.fresh) { e = ""; calc.fresh = false; calc.last = ""; }
    if (/(^|[+\-*\/])0$/.test(e)) e = e.slice(0, -1);
    calc.expr = e + k;
  }
  else if (k === ".") {
    if (calc.fresh) { e = "0"; calc.fresh = false; calc.last = ""; }
    var cur = e.match(/[\d.]*$/)[0];
    if (cur.indexOf(".") >= 0) return;
    calc.expr = e + (cur === "" ? "0." : ".");
  }
  else {
    calc.fresh = false;
    if (e === "") { if (k === "-") calc.expr = "-"; }
    else if (/[*\/]$/.test(e) && k === "-") calc.expr = e + k;
    else {
      if (/[+\-*\/]$/.test(e)) { e = e.replace(/[+\-*\/]+$/, ""); if (e === "") { renderCalc(); return; } }
      calc.expr = e + k;
    }
  }
  renderCalc();
}
$("keys").addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-k]");
  if (b) press(b.dataset.k);
});
/* keep the cursor in the number while the keypad is tapped */
$("keys").addEventListener("mousedown", function (ev) { if (calc.ed) ev.preventDefault(); });
/* tap any number in the expression to edit it with a cursor */
$("c-expr").addEventListener("click", function (ev) {
  var sp = ev.target.closest("span.c-n");
  if (!sp) return;
  var k = parseInt(sp.dataset.k, 10);
  if (calc.ed) commitEdit();
  else if (calc.fresh || calc.err) {
    if (!calc.last) return;
    calc.expr = calc.last; calc.last = ""; calc.fresh = false; calc.err = "";
  }
  if (k >= numToks(calc.expr).length) return;
  calc.ed = { k: k };
  renderCalc();
});
/* the expression shows 3 rows; the rest scrolls one whole row at a time */
var cSnapT = 0;
$("c-expr").addEventListener("scroll", function () {
  clearTimeout(cSnapT);
  cSnapT = setTimeout(function () {
    var el = $("c-expr"), L = parseFloat(getComputedStyle(el).lineHeight) || 26, t = Math.round(el.scrollTop / L) * L;
    if (Math.abs(t - el.scrollTop) > 1) el.scrollTo({ top: t, behavior: "smooth" });
  }, 90);
}, { passive: true });
$("c-expr").addEventListener("input", function (ev) {
  if (ev.target.id === "c-ed") { sanitizeEd(ev.target); updateEditOut(); }
});
$("c-expr").addEventListener("keydown", function (ev) {
  if (ev.target.id !== "c-ed") return;
  if (ev.key === "Enter") { ev.preventDefault(); commitEdit(); }
  else if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); calc.ed = null; renderCalc(); }
});

/* calculator history sheet */
var cPg = { p: 0 }, cAsk = false;
function sumNums(expr) {
  return /^\d+(\.\d+)?(\+\d+(\.\d+)?)+$/.test(String(expr)) ? String(expr).split("+").map(parseFloat) : null;
}
function calcItemHtml(e, i, n) {
  var vf = sumNums(e.expr) ? ' data-vf="1" data-id="' + esc(e.id) + '"' : "";
  return '<div class="c-item"' + vf + '><div class="c-no">' + esc(numf(n - i, 0)) + '</div><div class="c-body">' +
    '<div class="c-line"><span class="c-e">' + esc(dispExpr(e.expr)) + '</span><span class="c-r">= ' + esc(numf(e.result, 6)) + '</span></div>' +
    '<div class="c-line c-sub"><span>' + esc(whenLabel(e.ts)) + '</span><span class="h-actions">' +
    '<button type="button" class="link-btn" data-act="use" data-id="' + esc(e.id) + '">ব্যবহার</button>' +
    '<button type="button" class="trash-btn sm" data-act="del" data-id="' + esc(e.id) + '" aria-label="মুছুন">' + TRASH + '</button></span></div></div></div>';
}
function renderCalcHist() {
  var el = $("cs-clear");
  if (!state.calc.length) { el.innerHTML = ""; cAsk = false; } else el.innerHTML = clearHtml();
  drawPaged({
    list: "cs-list", pager: "cs-pager", info: "cs-info", prev: "cs-prev", next: "cs-next", pg: cPg, itemH: 72,
    items: function () { return state.calc; }, html: calcItemHtml,
    empty: '<p class="empty">এখনো কোনো হিসাব নেই। ক্যালকুলেটরে = চাপলে হিসাবটা এখানে জমা হবে।</p>'
  });
}
function openSheet() { commitEdit(); cPg.p = 0; cAsk = false; $("csheet").hidden = false; renderCalcHist(); }
function closeSheet() { $("vsheet").hidden = true; $("csheet").hidden = true; }
$("cs-open").addEventListener("click", openSheet);
$("cs-back").addEventListener("click", closeSheet);
$("cs-prev").addEventListener("click", function () { cPg.p--; renderCalcHist(); });
$("cs-next").addEventListener("click", function () { cPg.p++; renderCalcHist(); });
$("cs-list").addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-act]");
  if (!b) {
    var it = ev.target.closest(".c-item[data-vf]");
    if (it) openVerify(it.dataset.id);
    return;
  }
  var id = b.dataset.id;
  if (b.dataset.act === "del") {
    confirmBox("হিসাব মুছবেন?", "এই হিসাবটি মুছে ফেলা হবে।", "মুছুন", function () {
      state.calc = state.calc.filter(function (x) { return x.id !== id; });
      persistAll(); renderCalcHist();
    });
  } else {
    var e = state.calc.filter(function (x) { return x.id === id; })[0];
    if (!e || /e/i.test(String(e.result))) return;
    calc.expr = String(e.result); calc.last = e.expr; calc.fresh = true; calc.err = "";
    closeSheet(); renderCalc();
  }
});
$("cs-clear").addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-c]");
  if (!b) return;
  if (b.dataset.c === "ask") {
    confirmBox("সব হিসাব মুছবেন?", "ক্যালকুলেটরের সব হিস্টরি মুছে যাবে। এটা আর ফেরত আনা যাবে না।", "হ্যাঁ, মুছুন", function () {
      state.calc = []; cPg.p = 0; persistAll(); renderCalcHist();
    });
  }
});

/* ---------- মিলান: step through the saved prices one by one with arrows ---------- */
var vs = { id: "", orig: [], i: 0, done: [] };
function renderVerify() {
  var n = vs.orig.length, i = vs.i;
  $("v-del").hidden = n <= 2;
  $("v-pos").textContent = numf(i + 1, 0) + " / " + numf(n, 0);
  $("v-num").textContent = numf(vs.orig[i], 6);
  fitNum();
  var run = round8(vs.orig.slice(0, i + 1).reduce(function (s, v) { return s + v; }, 0));
  var all = round8(vs.orig.reduce(function (s, v) { return s + v; }, 0));
  $("v-tot").innerHTML = "<span>এ পর্যন্ত যোগফল: <b>" + esc(numf(run, 6)) + "</b></span><span>মোট: <b>" + esc(numf(all, 6)) + "</b></span>" +
    (vs.done.filter(Boolean).length === n ? '<span class="v-ok">✓ সব দাম দেখা শেষ, সব মিলেছে</span>' : "");
  $("v-expr").innerHTML = vs.orig.map(function (v, k) {
    return '<span class="v-n' + (k === i ? " cur" : "") + (vs.done[k] ? " done" : "") + '" data-i="' + k + '">' + esc(numf(v, 6)) + "</span>";
  }).join(" + ") + " = " + esc(numf(all, 6));
  vShow();
}
/* shrink a long number so it always stays on one line inside the box */
function fitNum() {
  var el = $("v-num"), box = el.parentNode;
  el.style.fontSize = "";
  var avail = box.clientWidth - 20, w = el.getBoundingClientRect().width;
  if (!w || !avail) return;
  var fs = parseFloat(getComputedStyle(el).fontSize);
  while (el.getBoundingClientRect().width > avail && fs > 12) { fs -= 1; el.style.fontSize = fs + "px"; }
}
/* the top expression shows 5 rows; the rest scrolls one whole row at a time */
var vSnapT = 0;
function vLine() { return parseFloat(getComputedStyle($("v-expr")).lineHeight) || 28; }
function vShow() {
  var el = $("v-expr"), cur = el.querySelector(".v-n.cur");
  if (!cur) return;
  var L = vLine(), row = Math.floor((cur.offsetTop + cur.offsetHeight / 2) / L), first = Math.round(el.scrollTop / L);
  if (row < first) el.scrollTop = row * L;
  else if (row > first + 4) el.scrollTop = (row - 4) * L;
}
$("v-expr").addEventListener("scroll", function () {
  clearTimeout(vSnapT);
  vSnapT = setTimeout(function () {
    var el = $("v-expr"), L = vLine(), t = Math.round(el.scrollTop / L) * L;
    if (Math.abs(t - el.scrollTop) > 1) el.scrollTo({ top: t, behavior: "smooth" });
  }, 90);
}, { passive: true });
function vStep(d) {
  var n = vs.orig.length;
  if (!n) return;
  closeEditRow();
  if (d > 0) { vs.done[vs.i] = true; if (vs.i < n - 1) vs.i++; }
  else if (vs.i > 0) { vs.done[vs.i] = false; vs.i--; vs.done[vs.i] = false; }
  else return;
  renderVerify();
}
function openVerify(id) {
  var e = state.calc.filter(function (x) { return x.id === id; })[0];
  var nums = e && sumNums(e.expr);
  if (!nums) return;
  vs = { id: id, orig: nums, i: 0, done: [] };
  closeEditRow();
  $("vsheet").hidden = false;
  $("v-expr").scrollTop = 0;
  renderVerify();
}
$("v-prev").addEventListener("click", function () { vStep(-1); });
$("v-next").addEventListener("click", function () { vStep(1); });
$("v-expr").addEventListener("click", function (ev) {
  var b = ev.target.closest("span.v-n");
  if (!b) return;
  closeEditRow(); vs.i = parseInt(b.dataset.i, 10); renderVerify();
});
/* wrong price? change or remove it here; the saved hisab is updated too */
function fitV(inp) { inp.style.width = (Math.max(2, inp.value.length) * 0.75 + 1.4) + "em"; }
function closeEditRow() { $("v-in").hidden = true; $("v-num").hidden = false; $("v-editrow").hidden = true; $("v-btns").hidden = false; $("v-in").blur(); }
function openEditRow() {
  var inp = $("v-in");
  $("v-num").hidden = true; inp.hidden = false; $("v-btns").hidden = true; $("v-editrow").hidden = false;
  inp.value = bnDigits(String(vs.orig[vs.i])); fitV(inp); inp.focus();
  try { var L = inp.value.length; inp.setSelectionRange(L, L); } catch (x) {}
}
function commitVerify() {
  var e = state.calc.filter(function (x) { return x.id === vs.id; })[0];
  if (!e) return;
  e.expr = vs.orig.map(String).join("+");
  e.result = round8(vs.orig.reduce(function (s, v) { return s + v; }, 0));
  persistAll(); renderCalcHist();
  renderVerify();
}
$("v-cur").addEventListener("click", function () { if ($("v-in").hidden) openEditRow(); });
$("v-cancel").addEventListener("click", closeEditRow);
function saveEdit() {
  var inp = $("v-in"), n = parse(inp.value);
  if (!(n >= 0)) { inp.focus(); return; }
  vs.orig[vs.i] = n; vs.done[vs.i] = false;
  closeEditRow(); commitVerify();
}
$("v-save").addEventListener("click", saveEdit);
$("v-in").addEventListener("input", function () {
  var i = $("v-in"), p = i.selectionStart;
  i.value = bnDigits(i.value); fitV(i);
  try { i.setSelectionRange(p, p); } catch (x) {}
});
$("v-in").addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); saveEdit(); } });
$("v-del").addEventListener("click", function () {
  confirmBox("দামটা বাদ দিবেন?", "এই দামটা হিসাব থেকে সরে যাবে আর যোগফল নতুন করে হবে।", "বাদ দিন", function () {
    vs.orig.splice(vs.i, 1); vs.done.splice(vs.i, 1);
    if (vs.i >= vs.orig.length) vs.i = vs.orig.length - 1;
    commitVerify();
  });
});
$("v-back").addEventListener("click", function () { $("vsheet").hidden = true; });
/* swipe left / right on the big number also steps */
(function () {
  var x0 = null, st = $("v-num").parentNode;
  st.addEventListener("touchstart", function (ev) { x0 = ev.touches[0].clientX; }, { passive: true });
  st.addEventListener("touchend", function (ev) {
    if (x0 === null) return;
    var dx = ev.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) vStep(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && !$("vsheet").hidden) { $("vsheet").hidden = true; return; }
  if (!$("vsheet").hidden) { if (ev.key === "ArrowRight") vStep(1); else if (ev.key === "ArrowLeft") vStep(-1); return; }
  if (ev.key === "Escape" && !$("menu").hidden) { closeMenu(); return; }
  if (activeTab !== "calc" || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (!$("csheet").hidden) { if (ev.key === "Escape") closeSheet(); return; }
  var tg = ev.target;
  if (tg && /^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName)) return;
  var k = ev.key, a = toAscii(k);
  if (/^[0-9]$/.test(a)) k = a;
  else if (k === "." || k === "+" || k === "-" || k === "*" || k === "/") { /* as is */ }
  else if (k === "x" || k === "X") k = "*";
  else if (k === "Enter" || k === "=") k = "=";
  else if (k === "Backspace") k = "⌫";
  else if (k === "Escape" || k === "Delete") k = "C";
  else return;
  ev.preventDefault();
  press(k);
});
window.addEventListener("resize", function () {
  renderHistory();
  if (!$("csheet").hidden) renderCalcHist();
});

/* ---------- unit picker: a see-through, blurred glass menu ---------- */
var UNIT_OPTS = [{ v: "g", n: "গ্রাম" }, { v: "kg", n: "কেজি" }];
var menu = $("menu"), menuFor = null;
var CHECK = '<svg class="chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';
function setPick(id) {
  var b = $(id), v = state.form[id] === "kg" ? "kg" : "g";
  b.dataset.v = v;
  b.querySelector(".pick-v").textContent = UNITS[v].n;
}
function closeMenu() {
  if (menu.hidden) return;
  menu.hidden = true;
  if (menuFor) $(menuFor).setAttribute("aria-expanded", "false");
  menuFor = null;
}
function openMenu(id) {
  var btn = $(id), cur = btn.dataset.v;
  closeMenu();
  menuFor = id;
  menu.innerHTML = UNIT_OPTS.map(function (o) {
    return '<button type="button" role="option" data-v="' + o.v + '" aria-selected="' + (o.v === cur) + '"><span>' + o.n + "</span>" + (o.v === cur ? CHECK : "") + "</button>";
  }).join("");
  menu.hidden = false;
  var r = btn.getBoundingClientRect();
  menu.style.minWidth = Math.max(140, r.width) + "px";
  var h = menu.offsetHeight, w = menu.offsetWidth;
  var top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - 6 - h);
  var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
  menu.style.top = top + "px";
  menu.style.left = left + "px";
  btn.setAttribute("aria-expanded", "true");
  var sel = menu.querySelector('[aria-selected="true"]');
  if (sel) sel.focus();
}
["ru", "wu"].forEach(function (id) {
  $(id).addEventListener("click", function () {
    if (menuFor === id && !menu.hidden) closeMenu(); else openMenu(id);
  });
});
menu.addEventListener("click", function (ev) {
  var b = ev.target.closest("button[data-v]");
  if (!b || !menuFor) return;
  var id = menuFor;
  state.form[id] = b.dataset.v; touched = true; saveLocal(); setPick(id); renderPrice();
  closeMenu();
});
menu.addEventListener("keydown", function (ev) {
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  ev.preventDefault();
  var items = [].slice.call(menu.querySelectorAll("button")), i = items.indexOf(document.activeElement);
  items[(i + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
});
document.addEventListener("pointerdown", function (ev) {
  if (!menu.hidden && !menu.contains(ev.target) && !ev.target.closest(".pick")) closeMenu();
});
window.addEventListener("resize", closeMenu);

/* ---------- tabs + boot ---------- */
var TABS = ["calc", "price"], activeTab = "calc";
function showTab(n) {
  activeTab = n;
  TABS.forEach(function (t) {
    var on = t === n;
    $("tab-" + t).setAttribute("aria-selected", String(on));
    $("p-" + t).hidden = !on;
  });
  $("ttl").textContent = n === "calc" ? "ক্যালকুলেটর" : "দাম হিসাব";
  closeSheet();
  if (n === "price") renderHistory();
}
TABS.forEach(function (t) { $("tab-" + t).addEventListener("click", function () { showTab(t); }); });

FIELDS.forEach(function (id) {
  var el = $(id);
  var on = function () {
    if (NUMF.indexOf(id) >= 0 && /[0-9]/.test(el.value)) {
      var pos = el.selectionStart;
      el.value = bnDigits(el.value);
      try { el.setSelectionRange(pos, pos); } catch (e) {}
    }
    syncSuf(id);
    state.form[id] = el.value; touched = true; saveLocal(); renderPrice(); };
  el.addEventListener("input", on);
  el.addEventListener("change", on);
  if (el.tagName === "INPUT") el.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && id !== "item") { ev.preventDefault(); saveEntry(); } });
});
["m-w", "m-p"].forEach(function (id) {
  $(id).addEventListener("click", function () { state.form.m = $(id).dataset.m; touched = true; saveLocal(); renderPrice(); });
});
$("save").addEventListener("click", saveEntry);
$("reset").addEventListener("click", function () {
  state.form = Object.assign({}, DEFAULT_FORM); touched = true;
  fillForm(); saveLocal(); renderPrice();
});

function renderAll() { fillForm(); renderPrice(); renderHistory(); renderCalc(); }

loadLocal();
renderAll();
showTab("calc");
initDb();
})();
</script>
